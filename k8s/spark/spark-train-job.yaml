# k8s/spark/spark-train-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-train-job
  namespace: ibdn
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-iceberg
          image: minio/mc:latest
          command:
            - sh
            - -c
            - |
              mc alias set minio http://minio:9000 minioadmin minioadmin
              until mc ls minio/flights/flight_features/raw/ > /dev/null 2>&1; do
                echo "waiting for iceberg table...";
                sleep 10;
              done
              echo "Iceberg table ready!"
        - name: wait-for-services
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              until nc -z spark-master 7077 && nc -z minio 9000 && nc -z mlflow 5000; do
                echo "waiting for spark, minio and mlflow...";
                sleep 5;
              done
      containers:
        - name: spark-train
          image: hineill/ibdn-spark-train-model:latest
          securityContext:
            runAsUser: 0
          envFrom:
            - configMapRef:
                name: ibdn-config
            - secretRef:
                name: ibdn-secrets
          command:
            - bash
            - -c
            - |
              MY_POD_IP=$(hostname -i)
              echo "Waiting for Spark cluster and MinIO..."
              sleep 15
              /opt/spark/bin/spark-submit \
                --master spark://spark-master:7077 \
                --conf spark.driver.bindAddress=0.0.0.0 \
                --conf spark.driver.host=$MY_POD_IP \
                --packages org.apache.hadoop:hadoop-aws:3.4.1,org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.0 \
                /app/train_spark_mllib_model.py