# k8s/spark/spark-master.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: ibdn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      initContainers:
        - name: wait-for-minio
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              until nc -z minio 9000; do
                echo "waiting for minio...";
                sleep 2;
              done
        - name: wait-for-kafka
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "waiting for kafka...";
                sleep 2;
              done
        - name: wait-for-cassandra
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              until nc -z cassandra 9042; do
                echo "waiting for cassandra...";
                sleep 2;
              done
      containers:
        - name: spark-master
          image: apache/spark:4.1.1
          securityContext:
            runAsUser: 0
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.master.Master
          ports:
            - containerPort: 7077
              name: master
            - containerPort: 8080
              name: ui
          env:
            - name: SPARK_MASTER_PORT
              value: "7077"
          readinessProbe:
            tcpSocket:
              port: 7077
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 7077
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: ibdn
spec:
  type: ClusterIP
  selector:
    app: spark-master
  ports:
    - port: 7077
      targetPort: 7077
      name: master
    - port: 8080
      targetPort: 8080
      name: ui
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-ui
  namespace: ibdn
spec:
  type: LoadBalancer
  selector:
    app: spark-master
  ports:
    - port: 8080
      targetPort: 8080
      name: ui