apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: ibdn
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              until nc -z minio 9000; do
                echo "waiting for minio...";
                sleep 2;
              done
      containers:
        - name: minio-init
          image: hineill/ibdn-minio-init:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: ibdn-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ibdn-secrets
                  key: MINIO_SECRET_KEY
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: ibdn-config
                  key: MINIO_ENDPOINT