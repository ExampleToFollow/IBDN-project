apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-init
  namespace: ibdn
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-cassandra
          image: busybox:1.28
          command:
            - sh
            - -c
            - |
              until nc -z cassandra 9042; do
                echo "waiting for cassandra...";
                sleep 5;
              done
      containers:
        - name: cassandra-init
          image: hineill/ibdn-cassandra-init:latest
          env:
            - name: CASSANDRA_HOST
              value: "cassandra"
            - name: CASSANDRA_PORT
              value: "9042"
          command: ["python", "/app/init.py"]