# k8s/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ibdn

resources:
  # Base
  - base/namespace.yaml
  - base/configmaps.yaml
  - base/secrets.yaml
  - base/infra-pvcs.yaml

  # Infraestructura
  - infra/kafka.yaml
  - infra/cassandra.yaml
  - infra/minio.yaml
  - infra/mlflow.yaml
  - infra/init-jobs.yaml

  # Spark
  - spark/spark-master.yaml
  - spark/spark-worker.yaml