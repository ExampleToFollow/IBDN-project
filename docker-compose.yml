services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Esperando a Kafka...';
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list; do
        sleep 2;
      done;

      echo 'Creando topics...';

      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic mi-topic-1 --partitions 1  --replication-factor 1;

      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic mi-topic-2 --partitions 1 --replication-factor 1;

      echo 'Topics creados:';
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list;
      "
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "flight-cluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
    volumes:
      - cassandra_data:/var/lib/cassandra
  cassandra-init:
    image: python:3.8-slim
    container_name: cassandra-init
    depends_on:
      - cassandra
    volumes:
      - ./data:/data
      - ./resources/cassandra:/app
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Instalando cassandra-driver...';
      pip install cassandra-driver;

      echo 'Esperando a Cassandra...';

      until python -c \"from cassandra.cluster import Cluster; cluster = Cluster(['cassandra'], port=9042); session = cluster.connect(); print('Cassandra lista'); cluster.shutdown()\"; do
        echo 'Cassandra aún no está lista, esperando 10s...';
        sleep 10;
      done;

      echo 'Cargando datos en Cassandra...';
      python /app/import_distances_cassandra.py;
      "
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      echo 'Esperando a MinIO...';

      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 2;
      done;

      echo 'Creando buckets...';

      mc mb --ignore-existing local/warehouse;
      mc mb --ignore-existing local/raw;
      mc mb --ignore-existing local/checkpoints;

      echo 'Subiendo dataset histórico a MinIO...';

      mc cp /data/simple_flight_delay_features.jsonl.bz2 local/raw/;

      echo 'Contenido de raw:';
      mc ls local/raw;
      "
  flask-web:
    build:
      context: .
      dockerfile: docker/flask/Dockerfile
    container_name: flask-web
    ports:
      - "5001:5001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PREDICTION_TOPIC: flight-delay-ml-request
      PROJECT_HOME: /app
    volumes:
      - /home/IBDN-project/resources/web:/app/resources/web
    depends_on:
      - kafka
    command: python /app/resources/web/predict_flask.py

volumes:  
  cassandra_data:
  minio_data: